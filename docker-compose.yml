# AutoOps 运维自动化平台 —— Docker Compose 部署
#
# 用法：
#   1. cp .env.docker.example .env  并改掉 SECRET_KEY / CREDENTIAL_SECRET
#   2. docker compose up -d --build
#   3. 打开 http://<服务器IP>:8080 ，账号 admin / admin123
#
# 切 PostgreSQL：docker compose --profile postgres up -d --build
#   同时在 .env 里设置 DATABASE_URL=postgresql+psycopg2://autoops:autoops@postgres:5432/autoops

name: autoops

services:
  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        INSTALL_ANSIBLE: ${INSTALL_ANSIBLE:-false}
    image: autoops-backend:latest
    container_name: autoops-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/autoops.db}
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY（可执行 openssl rand -base64 48 生成）}
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:?请在 .env 中设置 CREDENTIAL_SECRET（至少 32 字节）}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      EXECUTOR_BACKEND: ${EXECUTOR_BACKEND:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # 分布式调度（多副本：docker compose up -d --scale backend=N，需配 PostgreSQL）
      INSTANCE_ID: ${INSTANCE_ID:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_LEASE_TTL: ${SCHEDULER_LEASE_TTL:-30}
      SCHEDULER_HEARTBEAT: ${SCHEDULER_HEARTBEAT:-10}
      # 任务产物归档（local / s3，详见 DEPLOY.md 第 8 节）
      ARTIFACT_BACKEND: ${ARTIFACT_BACKEND:-local}
      ARTIFACT_DIR: ${ARTIFACT_DIR:-/app/data/artifacts}
      ARTIFACT_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-}
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-autoops-artifacts}
      ARTIFACT_S3_ACCESS_KEY: ${ARTIFACT_S3_ACCESS_KEY:-}
      ARTIFACT_S3_SECRET_KEY: ${ARTIFACT_S3_SECRET_KEY:-}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-30}
      # 主机探活（tcp / ping；间隔 0 = 关闭定时探测）
      PROBE_METHOD: ${PROBE_METHOD:-tcp}
      PROBE_TIMEOUT_SECONDS: ${PROBE_TIMEOUT_SECONDS:-3}
      HOST_PROBE_INTERVAL_MINUTES: ${HOST_PROBE_INTERVAL_MINUTES:-0}
      # 告警
      ALERT_AUTO_RESOLVE_MINUTES: ${ALERT_AUTO_RESOLVE_MINUTES:-0}
      # 任务执行默认值
      TASK_DEFAULT_MAX_RETRIES: ${TASK_DEFAULT_MAX_RETRIES:-0}
      TASK_DEFAULT_TIMEOUT_SECONDS: ${TASK_DEFAULT_TIMEOUT_SECONDS:-0}
      # 企业登录（LDAP / OIDC SSO，详见 DEPLOY.md 第 9 节）
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_SERVER: ${LDAP_SERVER:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(sAMAccountName={username})}
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-}
      LDAP_DEFAULT_ROLE: ${LDAP_DEFAULT_ROLE:-operator}
      LDAP_DEFAULT_TENANT: ${LDAP_DEFAULT_TENANT:-default}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oidc/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-operator}
      OIDC_DEFAULT_TENANT: ${OIDC_DEFAULT_TENANT:-default}
    volumes:
      - autoops-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: autoops-frontend:latest
    container_name: autoops-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：PostgreSQL（默认不启动，需 --profile postgres）
  postgres:
    image: postgres:16-alpine
    container_name: autoops-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoops}
      POSTGRES_DB: ${POSTGRES_DB:-autoops}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - autoops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoops}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  autoops-data:
  autoops-pgdata:
