# AutoOps 宿主机（裸机/VM）nginx 配置
# 安装位置：
#   Debian/Ubuntu: /etc/nginx/sites-available/autoops  -> 软链到 sites-enabled/
#   CentOS/RHEL:   /etc/nginx/conf.d/autoops.conf
#
# 占位符由 deploy/install.sh 自动替换：__APP_DIR__ / __WEB_PORT__ / __SERVER_NAME__

server {
    listen __WEB_PORT__;
    server_name __SERVER_NAME__;

    root __APP_DIR__/frontend/dist;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/autoops.access.log;
    error_log  /var/log/nginx/autoops.error.log;

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 批量任务/巡检可能较久，避免默认 60s 超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
