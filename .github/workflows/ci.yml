name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 编译 + 回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 安装中文字体（PDF 导出需要）
        run: sudo apt-get update && sudo apt-get install -y fonts-droid-fallback

      - name: 语法编译检查
        run: python -m compileall -q backend/app backend/scripts

      - name: 端到端冒烟测试（核心链路 / 租户隔离 / 调度选主）
        working-directory: backend
        run: python scripts/smoke_test.py

      - name: 新功能验收测试（探活 / 模板库 / 重试超时 / 导出 / 告警状态机）
        working-directory: backend
        run: python scripts/feature_test.py

      - name: 认证源测试（LDAP / OIDC 打桩）
        working-directory: backend
        run: python scripts/auth_test.py

      - name: 备份脚本自检（备份 → 校验 → 恢复）
        working-directory: backend
        run: python scripts/backup_test.py

  frontend:
    name: 前端 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 构建
        working-directory: frontend
        run: npm run build

      - name: 产物大小概览
        working-directory: frontend
        run: du -sh dist

  docker:
    name: 镜像 · 构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -f backend/Dockerfile -t autoops-backend:ci backend

      - name: 构建前端镜像
        run: docker build -f frontend/Dockerfile -t autoops-frontend:ci frontend
